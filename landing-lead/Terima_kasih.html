<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Terima Kasih</title>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1061291833613023');
fbq('track', 'PageView');

// Lead: dikirim sekali, lalu diblokir 10 menit agar refresh tidak menghitung ulang
(function () {
  var K = 'lead_sent_at', now = Date.now(), last = 0;
  try { last = parseInt(sessionStorage.getItem(K) || '0', 10) || 0; } catch (e) {}
  if (now - last > 600000) {
    fbq('track', 'Lead');
    try { sessionStorage.setItem(K, String(now)); } catch (e) {}
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1061291833613023&ev=PageView&noscript=1"
/></noscript>

<style>
:root{--ink:#0e1530;--ink2:#18214a;--line:rgba(255,255,255,.2);--txt:#f4f6ff;--mute:rgba(244,246,255,.74);--blue:#3d7bff;--cyan:#35d6e8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(120% 90% at 20% 0%,var(--ink2),var(--ink) 60%);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:460px;width:100%;border-radius:24px;border:1px solid var(--line);padding:36px 28px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),var(--ink2);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.ok{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;color:#06122e;background:linear-gradient(145deg,var(--cyan),var(--blue))}
h1{margin:0 0 10px;font-size:26px}
p{margin:0;color:var(--mute);line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="ok" aria-hidden="true">&#10003;</div>
  <h1>Terima kasih!</h1>
  <p>Data kamu sudah kami terima. Tim kami akan menghubungi kamu lewat WhatsApp atau email.</p>
</main>
</body>
</html>
