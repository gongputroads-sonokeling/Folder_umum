<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promo Spesial - Daftar Sekarang</title>

  <!-- TEMPEL KODE META PIXEL (bagian 1) DI SINI -->

  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; line-height: 1.3; }
    p.sub { color: #555; }
    form { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; margin-top: 8px; background: #1877f2; color: #fff; border: 0; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Judul Penawaran Kamu di Sini</h1>
    <p class="sub">Satu kalimat manfaat utama. Isi form, kami hubungi kamu.</p>

    <form name="lead" method="POST" data-netlify="true"
          netlify-honeypot="bot-field" action="/terima-kasih.html">
      <input type="hidden" name="form-name" value="lead" />
      <p hidden><label>Jangan diisi: <input name="bot-field" /></label></p>

      <!-- Field UTM (diisi otomatis oleh skrip UTM) -->
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />

      <input type="text" name="name" placeholder="Nama" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="tel" name="phone" placeholder="No. HP / WhatsApp" required />
      <button type="submit">Daftar Sekarang</button>
    </form>
  </div>

  <!-- TEMPEL KODE UTM CAPTURE (bagian 2) DI SINI -->
</body>
</html>
